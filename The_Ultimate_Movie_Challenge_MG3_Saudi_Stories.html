<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Ultimate Movie Challenge</title><style>:root{--navy:#07162c;--red:#bb1934;--gold:#ffcb65;--white:#f8f5ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#23395b,#07162c 70%);color:var(--white);font-family:Arial,sans-serif;min-height:100vh}.app{max-width:1100px;margin:auto;padding:18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:bold;color:var(--gold)}.score{border:1px solid #bd8c44;padding:9px 16px;border-radius:24px}main{min-height:74vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;animation:fade .35s}h1{font-size:clamp(35px,6vw,70px);color:var(--gold);margin:12px}h2{font-size:clamp(28px,4vw,45px);color:var(--gold)}p{font-size:clamp(18px,2.2vw,25px);line-height:1.5}.subtitle{font-size:24px}.card{background:linear-gradient(145deg,#182b48,#0c1a30);border:1px solid #52627b;border-radius:20px;padding:24px;margin:12px;max-width:850px;width:100%;box-shadow:0 15px 40px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;width:100%}.btn{background:#ad1734;color:white;border:2px solid #e6a35b;border-radius:13px;padding:14px 22px;font-size:19px;font-weight:bold;cursor:pointer;margin:7px;transition:.15s}.btn:hover,.btn:focus{transform:translateY(-2px);background:#d42b49}.btn.secondary{background:#1b375b}.btn:disabled{opacity:.4;cursor:not-allowed}.option{display:block;width:100%;text-align:left;background:#1a3554;border:2px solid #45617c;border-radius:12px;color:white;font-size:20px;padding:15px;margin:9px 0;cursor:pointer}.option.correct{background:#176b4b;border-color:#64db9d}.option.wrong{background:#8b2739;border-color:#ff9da8}.feedback{min-height:35px;font-size:21px;font-weight:bold;color:var(--gold);margin:12px}.clue{font-size:24px;border-left:5px solid var(--gold);background:#24344c;padding:18px;margin:14px;text-align:left}.scene{font-size:65px;padding:15px}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}input,textarea,select{width:100%;max-width:680px;padding:15px;font-size:20px;border-radius:12px;border:2px solid #b8b5b2;background:#fff;color:#13223a;margin:10px 0}textarea{min-height:105px}footer{text-align:center;color:#c5b7a2;font-size:14px;padding:10px}.pill{background:#6d1931;border:1px solid #e9bb70;border-radius:20px;padding:8px 18px}.progress{height:9px;background:#263d5c;border-radius:12px;overflow:hidden;margin:16px 0}.progress span{display:block;background:var(--gold);height:100%;transition:.3s}.filmstrip{font-size:35px;letter-spacing:10px}.hide{display:none}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:600px){.card{padding:16px}.btn{font-size:17px;padding:12px}.option{font-size:17px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="app"><header class="bar"><div class="brand">🎬 MEGA GOAL 3 · UNIT 4 · LESSON 1</div><div class="score">⭐ Score: <span id="score">0</span></div></header><div class="progress"><span id="progress"></span></div><main id="main" aria-live="polite"></main><nav class="nav"><button class="btn secondary" onclick="go(0)">⌂ Home</button><button class="btn secondary" onclick="go(Math.max(0,step-1))">← Back</button><button class="btn" onclick="go(Math.min(9,step+1))">Next →</button><button class="btn secondary" onclick="restart()">↻ Restart Challenge</button></nav><footer>Teacher: Ghaliah Al-Shamrani · Offline classroom game · No login required</footer></div><script>
let step=0,score=0,awarded=new Set(),genreIndex=0,movieIndex=0,clueCount=1,vocabIndex=0,compIndex=0,finalIndex=0,finalScore=0,answered=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function point(key,n=1){if(!awarded.has(key)){awarded.add(key);score+=n;$('score').textContent=score}}function layout(title,html){$('main').innerHTML=`<h2>${title}</h2>${html}`;$('progress').style.width=((step+1)/10*100)+'%'}function go(n){step=n;answered=false;render();window.scrollTo(0,0)}function restart(){score=0;awarded.clear();genreIndex=movieIndex=vocabIndex=compIndex=finalIndex=finalScore=0;clueCount=1;$('score').textContent=0;go(0)}function options(items,correct,key,after){let box=$('choices');box.innerHTML=items.map((v,i)=>`<button class="option" onclick="choose(${i},${correct},'${key}')">${esc(v)}</button>`).join('');window.choiceAfter=after}function choose(i,correct,key){if(answered)return;answered=true;document.querySelectorAll('#choices .option').forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=i===correct?'✓ Correct! Great work!':'Not quite. The correct answer is: '+document.querySelectorAll('#choices .option')[correct].textContent;if(i===correct)point(key);if(window.choiceAfter)window.choiceAfter(i===correct)}
const genres=[{icon:'🧸🎨',scene:'A colorful story told with drawn characters and imaginative worlds.',answer:0},{icon:'😂🎭',scene:'Funny misunderstandings and silly situations make the audience laugh.',answer:1},{icon:'🧭🏔️',scene:'Explorers travel through dangerous mountains in search of a lost city.',answer:2},{icon:'🚀🪐',scene:'Astronauts travel to a distant planet using futuristic technology.',answer:3}],genreNames=['Animation','Comedy','Adventure','Science Fiction'];const movies=[{name:'Jurassic World: Fallen Kingdom',genre:'Science fiction / Action-adventure',clues:['A science-fiction action-adventure story features dinosaurs.','A dormant volcano becomes active on an abandoned island.','A team returns to Isla Nublar to rescue surviving dinosaurs.'],q:'Why does the team return to the island?',opts:['To rescue dinosaurs','To film a comedy','To win a prize'],a:0,emoji:'🦖🌋'},{name:'The Lion King',genre:'Animation / Adventure',clues:['An animated story follows a young animal growing up.','An evil uncle causes a family tragedy, and the young hero leaves home.','A lion cub returns to reclaim his family throne.'],q:'What does the young lion hope to reclaim?',opts:['A spaceship','His family throne','A school'],a:1,emoji:'🦁🌅'},{name:'Sonic the Hedgehog',genre:'Action-adventure / Comedy',clues:['A very fast character arrives on Earth from another planet.','The hero causes a power outage while playing baseball.','A blue hedgehog teams up with a sheriff to escape Dr. Robotnik.'],q:'What special ability does the main character have?',opts:['Flying','Super speed','Reading minds'],a:1,emoji:'💨⚡'},{name:'Bruce Lee: A Warrior’s Journey',genre:'Documentary / Biography',clues:['This documentary explores the life of a famous performer.','It includes rare footage and notes about an unfinished project.','It focuses on martial arts star Bruce Lee and his film Game of Death.'],q:'What kind of film is this?',opts:['Animated fantasy','Documentary','Science fiction'],a:1,emoji:'🎥🥋'},{name:'A Beautiful Mind',genre:'Biographical drama',clues:['This film is based on the life of a prominent mathematician.','The main character struggles with delusions and receives support from his wife.','John Nash continues his research and later wins a Nobel Prize.'],q:'What is John Nash’s field?',opts:['Mathematics','Music','Sports'],a:0,emoji:'🧠🏅'}];const vocab=[['abrupt','sudden and unexpected'],['animated','made using drawings or computer-created images'],['prominent','important and well known'],['untimely','happening at an unfortunate or unexpected time'],['delusions','strong beliefs that are not true'],['capture','record images on film'],['prestigious','highly respected and admired'],['conspiracy','a secret plan to do something illegal or harmful']];const sentences=[['The Lion King is an example of a(n) _____ film.','animated'],['The Nobel Prize is the most _____ award a scientist can win.','prestigious'],['The police uncovered a(n) _____ to kill the president.','conspiracy'],['A young actor’s _____ death in an accident usually gets wide media coverage.','untimely'],['A cameraman’s job is to _____ the scenes on film.','capture'],['Chris O’Donnell played the part of Hemingway, a _____ American writer.','prominent'],['The _____ ending of the film surprised us.','abrupt'],['_____ can sometimes be a symptom of mental instability.','delusions']];const comps=[['Which TV film talks about growing up and assuming adult responsibilities?',['The Lion King','Sonic the Hedgehog','A Beautiful Mind'],0],['Which TV films are set in places that do not exist in real life?',['Jurassic World: Fallen Kingdom and The Lion King','A Beautiful Mind and Bruce Lee: A Warrior’s Journey','Sonic the Hedgehog and A Beautiful Mind'],0],['In which film does a character have superpowers?',['The Lion King','Sonic the Hedgehog','A Beautiful Mind'],1],['Which two TV films are biographical?',['The Lion King and Sonic the Hedgehog','Jurassic World and The Lion King','Bruce Lee: A Warrior’s Journey and A Beautiful Mind'],2]];const finals=[['Which genre uses drawn or computer-created characters?',['Documentary','Animation','Biography'],1],['What does “abrupt” mean?',['Sudden and unexpected','Highly respected','Very famous'],0],['Who returns to save dinosaurs?',['John Nash','A team led by Claire and Owen','A young lion'],1],['Which word means “a secret illegal plan”?',['capture','prestigious','conspiracy'],2],['Which film follows the life of mathematician John Nash?',['A Beautiful Mind','Sonic the Hedgehog','The Lion King'],0]];
function render(){if(step===0){layout('🎬 THE ULTIMATE MOVIE CHALLENGE',`<div class="card"><div class="scene">🍿 🎞️ 🎟️</div><h1>Lights, Camera, English!</h1><p>Are You Ready for the Ultimate Movie Challenge?</p><p class="pill">The World of TV · Listen and Discuss</p><button class="btn" onclick="countdown()">▶ START</button><p class="subtitle">45 minutes · 10 interactive scenes</p></div>`)}if(step===1)showGenre();if(step===2)showTalk();if(step===3)showMovie();if(step===4)showVocab();if(step===5)showComp();if(step===6)showDirector();if(step===7)showFinal();if(step===8)showExit();if(step===9)showSaudi()}
function countdown(){let n=3;layout('🎞️ Movie Night Begins',`<div class="card"><h1 id="count">3</h1><p>Get ready for the challenge!</p></div>`);let timer=setInterval(()=>{n--;if(n===0){clearInterval(timer);go(1)}else $('count').textContent=n},800)}function showGenre(){let g=genres[genreIndex];layout('🎭 Guess the Genre',`<div class="card"><p>Scene ${genreIndex+1} of 4</p><div class="scene">${g.icon}</div><p>${g.scene}</p><div id="choices"></div><div class="feedback" id="feedback"></div><button class="btn" id="advance" style="display:none" onclick="${genreIndex===3?'go(2)':'genreIndex++;answered=false;showGenre()'}">${genreIndex===3?'Continue to Movie Talk →':'Next Genre →'}</button></div>`);options(genreNames,g.answer,'genre'+genreIndex,()=>{$('advance').style.display='inline-block'})}function showTalk(){layout('🎤 Movie Talk',`<div class="card"><p>Discuss with a partner or share with the class.</p><div class="clue">1. What is your favorite TV film? Why is it your favorite?</div><div class="clue">2. Which do you prefer: animation, comedy, or adventure? Why?</div><div class="clue">3. What is the worst TV film you have ever seen? Explain.</div><button class="btn" onclick="point('talk');go(3)">We Shared Our Ideas! →</button></div>`)}function showMovie(){let m=movies[movieIndex];layout('🕵️ The Mystery Movie Challenge',`<div class="card"><p class="pill">Mission ${movieIndex+1} of 5</p><div class="scene">🎬 ❓</div><p>Read the clues. Guess the film before revealing the answer!</p>${m.clues.slice(0,clueCount).map((c,i)=>`<div class="clue"><b>Clue ${i+1}:</b> ${esc(c)}</div>`).join('')}<button class="btn secondary" ${clueCount===3?'disabled':''} onclick="clueCount++;showMovie()">🔓 Reveal Next Clue</button><select id="guess"><option value="">Choose a movie...</option>${movies.map((f,i)=>`<option value="${i}">${esc(f.name)}</option>`).join('')}</select><button class="btn" onclick="guessMovie()">Check My Guess</button><div id="reveal"></div></div>`)}function guessMovie(){let v=$('guess').value;if(v===''){alert('Choose a movie first!');return}let m=movies[movieIndex];if(Number(v)===movieIndex)point('movie'+movieIndex);$('reveal').innerHTML=`<div class="feedback">${Number(v)===movieIndex?'⭐ Correct guess!':'Good try! Here is the answer.'}</div><div class="scene">${m.emoji}</div><h2>🎉 ${esc(m.name)}</h2><p><b>Genre:</b> ${esc(m.genre)}</p><p>${esc(m.q)}</p><div id="choices"></div><div class="feedback" id="feedback"></div><button class="btn" id="advance" style="display:none" onclick="${movieIndex===4?'go(4)':'movieIndex++;clueCount=1;answered=false;showMovie()'}">${movieIndex===4?'Unlock Vocabulary →':'Next Mission →'}</button>`;answered=false;options(m.opts,m.a,'movieq'+movieIndex,()=>{$('advance').style.display='inline-block'})}
function showVocab(){let [word,meaning]=vocab[vocabIndex];let wrong=vocab.filter(x=>x[0]!==word).slice((vocabIndex*2)%7).map(x=>x[1]);while(wrong.length<3)wrong.push(vocab[(vocabIndex+wrong.length+1)%8][1]);let arr=[meaning,...wrong.slice(0,3)];arr=arr.map((v,i)=>({v,sort:(i*7+vocabIndex*3)%5})).sort((a,b)=>a.sort-b.sort).map(x=>x.v);layout('🔑 Unlock the Vocabulary',`<div class="card"><p class="pill">Part A · Match ${vocabIndex+1}/8</p><h1>${word}</h1><p>Choose the correct meaning.</p><div id="choices"></div><div class="feedback" id="feedback"></div><button class="btn" id="advance" style="display:none" onclick="${vocabIndex===7?'showSentence(0)':'vocabIndex++;answered=false;showVocab()'}">${vocabIndex===7?'Textbook Sentences →':'Next Word →'}</button></div>`);options(arr,arr.indexOf(meaning),'vocab'+vocabIndex,()=>{$('advance').style.display='inline-block'})}function showSentence(i){if(i===8){go(5);return}let [s,w]=sentences[i];let opts=[w,...vocab.filter(v=>v[0]!==w).slice(i%5,i%5+3).map(v=>v[0])];opts=opts.sort((a,b)=>((a.charCodeAt(0)+i*3)%7)-((b.charCodeAt(0)+i*3)%7));layout('📝 Vocabulary in Context',`<div class="card"><p class="pill">Part B · Textbook sentence ${i+1}/8</p><p>${esc(s)}</p><div id="choices"></div><div class="feedback" id="feedback"></div><button class="btn" id="advance" style="display:none" onclick="answered=false;showSentence(${i+1})">${i===7?'Movie Detective →':'Next Sentence →'}</button></div>`);options(opts,opts.indexOf(w),'sentence'+i,()=>{$('advance').style.display='inline-block'})}function showComp(){let [q,opts,a]=comps[compIndex];layout('🔎 Movie Detective',`<div class="card"><p class="pill">Question ${compIndex+1}/4</p><p>${esc(q)}</p><div id="choices"></div><div class="feedback" id="feedback"></div><button class="btn" id="advance" style="display:none" onclick="${compIndex===3?'go(6)':'compIndex++;answered=false;showComp()'}">${compIndex===3?'Become a Movie Director →':'Next Question →'}</button></div>`);options(opts,a,'comp'+compIndex,()=>{$('advance').style.display='inline-block'})}function showDirector(){layout('🎥 Become a Movie Director',`<div class="card"><p>Work in pairs. Write three clues about a movie without saying its name. Let your classmates guess!</p><label for="c1">1. This movie is about...</label><textarea id="c1" placeholder="This movie is about..."></textarea><label for="c2">2. The main character...</label><textarea id="c2" placeholder="The main character..."></textarea><label for="c3">3. The story takes place...</label><textarea id="c3" placeholder="The story takes place..."></textarea><button class="btn" onclick="saveDirector()">🎬 Present Our Clues</button><div class="feedback" id="directorFeedback"></div></div>`)}function saveDirector(){let v=['c1','c2','c3'].map(id=>$(id).value.trim());if(v.some(x=>!x)){$('directorFeedback').textContent='Please write all three clues.';return}point('director',2);$('directorFeedback').textContent='🎉 Great directing! Read your clues to the class.';let b=document.createElement('button');b.className='btn';b.textContent='Final Challenge →';b.onclick=()=>go(7);$('directorFeedback').appendChild(b)}function showFinal(){if(finalIndex>=5){layout('🏆 Your Final Score',`<div class="card"><div class="scene">🏆🌟🍿</div><h1>${finalScore} / 5</h1><p>${finalScore>=4?'Congratulations! You Are a Movie Expert!':'Great effort! Keep practicing, Movie Detective!'}</p><p>Total stars earned: ⭐ ${score}</p><button class="btn" onclick="go(8)">Exit Ticket →</button><button class="btn secondary" onclick="finalIndex=0;finalScore=0;answered=false;showFinal()">↻ Retry Final Quiz</button></div>`);return}let [q,opts,a]=finals[finalIndex];layout('🏆 Final Movie Challenge',`<div class="card"><p class="pill">Question ${finalIndex+1} / 5</p><p>${esc(q)}</p><div id="choices"></div><div class="feedback" id="feedback"></div><button class="btn" id="advance" style="display:none" onclick="finalIndex++;answered=false;showFinal()">${finalIndex===4?'See My Score →':'Next Question →'}</button></div>`);options(opts,a,'final'+finalIndex,correct=>{if(correct)finalScore++;$('advance').style.display='inline-block'})}function showExit(){layout('🎟️ Exit Ticket',`<div class="card"><p>Which movie would you like to watch? Why?</p><textarea id="exitText" placeholder="I would like to watch... because..."></textarea><button class="btn" onclick="submitExit()">Submit My Ticket</button><div id="exitResult"></div></div>`)}function submitExit(){let t=$('exitText').value.trim();if(t.length<10){$('exitResult').innerHTML='<p>Please write a complete sentence and give a reason.</p>';return}point('exit');$('exitResult').innerHTML=`<div class="feedback">✓ Ticket submitted on this device!</div><div class="clue">${esc(t)}</div><h2>🍿 Thank You!</h2><p>Lights, Camera, English!</p><p>⭐ Total score: ${score}</p><button class="btn" onclick="window.print()">🖨️ Print My Ticket</button><button class="btn" onclick="go(9)">🇸🇦 Discover Saudi Stories →</button><button class="btn secondary" onclick="restart()">Play Again</button><p style="font-size:15px">Your answer stays on this device; it is not sent to the teacher automatically.</p>`}function showSaudi(){layout('🇸🇦 Saudi Stories on Screen',`<div class="card"><p class="pill">Scene 10 · Real-Life Connection · Saudi Vision 2030</p><div class="scene">🇸🇦 🎬 🌟</div><h1>Our Stories. Our Culture. Our Future.</h1><p>Movies are more than entertainment. They tell stories, share cultures, and inspire people.</p><p>Saudi Vision 2030 supports creativity and the growth of the Saudi film industry.</p><h2>🎥 Your Mission</h2><p>If you could make a film about Saudi Arabia, what story would you tell?</p><label for="saudiStory">My Saudi movie idea:</label><textarea id="saudiStory" placeholder="My movie would tell the story of..."></textarea><button class="btn" onclick="submitSaudi()">🎟️ Share My Story</button><div id="saudiResult" aria-live="polite"></div></div>`)}
function submitSaudi(){let idea=$('saudiStory').value.trim();if(idea.length<12){$('saudiResult').innerHTML='<p>Please describe your movie idea in a complete sentence.</p>';return}point('saudi',2);$('saudiResult').innerHTML=`<div class="feedback">🌟 Be proud of your culture. Share your story with the world!</div><div class="clue">${esc(idea)}</div><h2>🎬 Congratulations, Saudi Storyteller!</h2><p>⭐ Total stars: ${score}</p><button class="btn" onclick="window.print()">🖨️ Print My Story</button><button class="btn secondary" onclick="restart()">↻ Play Again</button><p style="font-size:15px">Your story stays on this device and is not automatically sent to your teacher.</p>`}
render();</script></body></html>
